<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うさトレ</title>

    <!-- ▼ まる文字フォント（Zen Maru Gothic） -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Workout Tracker</h1>
        <div class="subtitle">うさトレ</div>
    </header>

    <!-- ▼ タブ切り替えボタン -->
    <div class="main-tabs">
        <button type="button" class="main-tab-btn active" onclick="switchMainTab('record')">LOG</button>
        <button type="button" class="main-tab-btn" onclick="switchMainTab('menu-list')">MENU</button>
        <button type="button" class="main-tab-btn" onclick="switchMainTab('history')">HISTORY</button>
    </div>

    <!-- ▼ 1. 記録タブ用コンテンツ -->
    <div id="tab-content-record" class="main-tab-content active">
        <!-- メイン：部位選択ガイドバナー -->
        <div class="recommendation-card">
            <div class="recommendation-header">SELECT WORKOUT</div>
            
            <!-- 部位選択ボタン群 -->
            <div class="category-select-grid">
                <button type="button" class="btn-category-select" onclick="openCategoryWorkout('上半身')">
                    <span class="cat-label">上半身</span>
                    <span class="cat-days" id="days-upper">前回: -日目</span>
                </button>
                <button type="button" class="btn-category-select" onclick="openCategoryWorkout('下半身')">
                    <span class="cat-label">下半身</span>
                    <span class="cat-days" id="days-lower">前回: -日目</span>
                </button>
                <button type="button" class="btn-category-select" onclick="openCategoryWorkout('全身')">
                    <span class="cat-label">全身</span>
                    <span class="cat-days" id="days-full">前回: -日目</span>
                </button>
                <button type="button" class="btn-category-select" onclick="openCategoryWorkout('有酸素')">
                    <span class="cat-label">有酸素</span>
                    <span class="cat-days" id="days-cardio">前回: -日目</span>
                </button>
            </div>

            <div class="banner-actions" style="margin-top: 12px;">
                <button class="btn-offday" onclick="recordOffDay()" style="width: 100%;">今日はオフ</button>
            </div>
        </div>

        <!-- カレンダーセクション -->
        <section class="log-section">
            <div class="calendar-card">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">&lt;</button>
                    <span id="calendar-month-year"></span>
                    <button onclick="changeMonth(1)">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- JSで生成 -->
                </div>
            </div>
        </section>
    </div>

    <!-- ▼ 2. 記録一覧（タイムライン）タブ用コンテンツ -->
    <div id="tab-content-history" class="main-tab-content">
        <div id="history-log-container">
            <!-- JSでタイムラインカードを自動生成 -->
        </div>
    </div>

    <!-- ▼ 3. メニュー一覧タブ用コンテンツ -->
    <div id="tab-content-menu-list" class="main-tab-content">
        <section class="table-section">
            <div class="table-wrapper">
                <table class="menu-table">
                    <thead>
                        <tr>
                            <th style="width: 12%;">メニュー</th>
                            <th style="width: 25%;">対象部位</th>
                            <th style="width: 38%;">種目と設定</th>
                            <th style="width: 15%;">メモ / 注意点</th>
                            <th style="width: 10%;">編集</th>
                        </tr>
                    </thead>
                    <tbody id="menu-table-body">
                        <!-- JSでテーブル行を生成 -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- メニュー編集用モーダルウィンドウ -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>メニュー編集 (<span id="edit-menu-id"></span>)</h2>
                <button class="btn-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label class="form-label">メニュータイトル / 対象部位</label>
                <input type="text" id="edit-menu-title" class="form-input">

                <label class="form-label">メモ・フォームの注意点</label>
                <textarea id="edit-menu-memo" class="form-input form-textarea" placeholder="例: シートの高さは3、グリップは広め"></textarea>

                <label class="form-label">種目リスト（⋮⋮ ドラッグで並び替え）</label>
                <div id="exercise-inputs-container">
                    <!-- Dynamic exercise inputs -->
                </div>
                <button class="btn-add-exercise" onclick="addExerciseInput()">+ 種目を追加</button>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">キャンセル</button>
                <button class="btn-save" onclick="saveMenuEdit()">保存する</button>
            </div>
        </div>
    </div>

    <!-- ワークアウト結果記録用モーダル -->
    <div class="modal-overlay" id="workout-log-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>トレーニング記録</h2>
                <button class="btn-close" onclick="closeWorkoutLogModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label class="form-label">日付</label>
                <input type="date" id="select-log-date" class="form-input">

                <label class="form-label">タイプ</label>
                <div class="rotation-mode-options" style="margin-bottom: 16px;">
                    <label class="rotation-mode-option">
                        <input type="radio" name="record-type" id="record-type-menu" onchange="toggleRecordType()">
                        <span>メニューから</span>
                    </label>
                    <label class="rotation-mode-option">
                        <input type="radio" name="record-type" id="record-type-free" onchange="toggleRecordType()">
                        <span>自由入力</span>
                    </label>
                    <label class="rotation-mode-option">
                        <input type="radio" name="record-type" id="record-type-off" onchange="toggleRecordType()">
                        <span>オフ</span>
                    </label>
                </div>

                <label class="form-label" id="select-log-menu-label">実施メニューを選択</label>
                <select id="select-log-menu" class="form-input" onchange="onLogMenuSelectChange(this.value)">
                    <!-- JSで選択肢を自動生成 -->
                </select>

                <div id="workout-log-inputs">
                    <!-- 基本メニューの数値入力欄 -->
                </div>

                <div class="extra-exercise-section" id="free-exercise-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" id="extra-exercise-label" style="margin-bottom: 0;">実施した種目</label>
                        <button type="button" class="btn-add-extra" style="width: auto; padding: 6px 12px; font-size: 0.8125rem;" onclick="addExtraExerciseInput()">+ 種目を追加</button>
                    </div>
                    <div id="extra-exercise-container">
                        <!-- カード追加用エリア -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeWorkoutLogModal()">キャンセル</button>
                <button class="btn-save" onclick="submitWorkoutLog()">記録して完了</button>
            </div>
        </div>
    </div>

    <!-- カレンダー記録の詳細確認・削除モーダル -->
    <div class="modal-overlay" id="detail-log-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>記録の詳細 (<span id="detail-log-date"></span>)</h2>
                <button class="btn-close" onclick="closeDetailLogModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: var(--primary-color);" id="detail-log-title"></div>
                <div id="detail-log-body">
                    <!-- JSで詳細内容を表示 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" id="btn-edit-detail-log" style="margin-right: auto;">編集する</button>
                <button class="btn-reset" style="margin-top:0; color:#ef4444;" id="btn-delete-detail-log">この記録を削除する</button>
                <button class="btn-cancel" onclick="closeDetailLogModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- テーマ設定モーダル -->
    <div class="modal-overlay" id="theme-settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎨 カラーテーマを選択</h2>
                <button class="btn-close" onclick="closeThemeSettingsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="theme-select-grid">
                    <button type="button" class="btn-theme-option" onclick="changeTheme('blue')">
                        <span class="theme-color-dot" style="background:#82A0C2;"></span>
                    </button>
                    <button type="button" class="btn-theme-option" onclick="changeTheme('pink')">
                        <span class="theme-color-dot" style="background:#EAA4B2;"></span>
                    </button>
                    <button type="button" class="btn-theme-option" onclick="changeTheme('green')">
                        <span class="theme-color-dot" style="background:#88C4B8;"></span>
                    </button>
                    <button type="button" class="btn-theme-option" onclick="changeTheme('lavender')">
                        <span class="theme-color-dot" style="background:#A49BCE;"></span>
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeThemeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 種目リスト管理モーダル -->
    <div class="modal-overlay" id="exercise-library-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>種目リスト管理</h2>
                <button class="btn-close" onclick="closeExerciseLibraryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label class="form-label">ラベルを選択</label>
                <div class="label-tab-row" id="library-label-tabs">
                    <!-- JSでラベルタブを生成 -->
                </div>

                <div class="exercise-chip-list" id="library-exercise-chips">
                    <!-- JSで種目チップを生成 -->
                </div>

                <div class="library-add-row">
                    <input type="text" id="library-new-exercise-input" class="form-input" placeholder="新しい種目を追加" style="margin-bottom:0;">
                    <button type="button" class="btn-library-add" onclick="addLibraryExercise()">追加</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeExerciseLibraryModal()">閉じる</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-tools">
            <button type="button" class="btn-footer-tool" id="btn-open-exercise-library" onclick="openExerciseLibraryModal()">📋</button>
            <button type="button" class="btn-footer-tool" onclick="openThemeSettingsModal()">🎨</button>
            <button type="button" class="btn-footer-tool" onclick="importPastLogs()">📥</button>
        </div>
        <button type="button" class="btn-reset" onclick="resetData()">履歴・メニュー設定を初期化</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
